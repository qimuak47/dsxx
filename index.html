<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0e1a" />
<title>第十行星v0.5.2</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0e1a; }
  * { box-sizing: border-box; }
  #root { position: fixed; inset: 0; }
</style>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none;
  -webkit-user-select: none;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  color: #e8eef7;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
    "Helvetica Neue", sans-serif;
  overscroll-behavior: none;
  touch-action: none;
}

#__next {
  width: 100%;
  height: 100vh;
  height: 100dvh;
}

/* ===== 统一的璀璨银河背景 ===== */
/* 注：728修改文档要求主色调不要纯黑，统一淡色调璀璨银河 */
.galaxy-bg {
  background:
    radial-gradient(ellipse at 20% 30%, rgba(90, 60, 150, 0.25) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(60, 90, 150, 0.2) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(160, 107, 255, 0.08) 0%, transparent 70%),
    linear-gradient(135deg, #1a1f3a 0%, #141833 50%, #1a1530 100%);
  position: relative;
}

/* 星点装饰（伪元素） */
.galaxy-bg::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(1px 1px at 20px 30px, #ffffff, transparent),
    radial-gradient(1px 1px at 60px 70px, #ffffff, transparent),
    radial-gradient(1px 1px at 120px 40px, #a0a8c0, transparent),
    radial-gradient(1px 1px at 200px 90px, #ffffff, transparent),
    radial-gradient(1px 1px at 280px 50px, #a0a8c0, transparent),
    radial-gradient(1px 1px at 350px 120px, #ffffff, transparent),
    radial-gradient(2px 2px at 100px 200px, #ffd86b, transparent),
    radial-gradient(1px 1px at 250px 250px, #ffffff, transparent),
    radial-gradient(1px 1px at 50px 350px, #a0a8c0, transparent),
    radial-gradient(2px 2px at 180px 400px, #a06bff, transparent),
    radial-gradient(1px 1px at 300px 380px, #ffffff, transparent),
    radial-gradient(1px 1px at 80px 500px, #a0a8c0, transparent);
  background-size: 400px 600px;
  background-repeat: repeat;
  opacity: 0.6;
  pointer-events: none;
  animation: starTwinkle 4s ease-in-out infinite alternate;
}

@keyframes starTwinkle {
  0% { opacity: 0.4; }
  100% { opacity: 0.8; }
}

/* ===== 通用动画 ===== */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

/* 730新增：标题若隐若现动态效果 */
@keyframes titlePulse {
  0%, 100% { opacity: 1; filter: drop-shadow(0 0 20px rgba(160,107,255,0.6)); }
  50% { opacity: 0.7; filter: drop-shadow(0 0 40px rgba(255,138,74,0.8)); }
}

/* ===== 按钮交互反馈 ===== */
/* 注：728修改文档要求按钮点击后要有交互反应 */
.btn-press {
  transition: transform 0.1s ease, filter 0.1s ease, box-shadow 0.1s ease;
}
.btn-press:active {
  transform: scale(0.94);
  filter: brightness(1.3);
}

</style>
</head>
