<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/><title>第十行星 - v0.2测试版</title><style>* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none;
  -webkit-user-select: none;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  color: #e8eef7;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
    "Helvetica Neue", sans-serif;
  overscroll-behavior: none;
  touch-action: none;
}

#root {
  width: 100%;
  height: 100vh;
  height: 100dvh;
}

/* ===== 统一的璀璨银河背景 ===== */
/* 注：728修改文档要求主色调不要纯黑，统一淡色调璀璨银河 */
.galaxy-bg {
  background:
    radial-gradient(ellipse at 20% 30%, rgba(90, 60, 150, 0.25) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(60, 90, 150, 0.2) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(160, 107, 255, 0.08) 0%, transparent 70%),
    linear-gradient(135deg, #1a1f3a 0%, #141833 50%, #1a1530 100%);
  position: relative;
}

/* 星点装饰（伪元素） */
.galaxy-bg::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(1px 1px at 20px 30px, #ffffff, transparent),
    radial-gradient(1px 1px at 60px 70px, #ffffff, transparent),
    radial-gradient(1px 1px at 120px 40px, #a0a8c0, transparent),
    radial-gradient(1px 1px at 200px 90px, #ffffff, transparent),
    radial-gradient(1px 1px at 280px 50px, #a0a8c0, transparent),
    radial-gradient(1px 1px at 350px 120px, #ffffff, transparent),
    radial-gradient(2px 2px at 100px 200px, #ffd86b, transparent),
    radial-gradient(1px 1px at 250px 250px, #ffffff, transparent),
    radial-gradient(1px 1px at 50px 350px, #a0a8c0, transparent),
    radial-gradient(2px 2px at 180px 400px, #a06bff, transparent),
    radial-gradient(1px 1px at 300px 380px, #ffffff, transparent),
    radial-gradient(1px 1px at 80px 500px, #a0a8c0, transparent);
  background-size: 400px 600px;
  background-repeat: repeat;
  opacity: 0.6;
  pointer-events: none;
  animation: starTwinkle 4s ease-in-out infinite alternate;
}

@keyframes starTwinkle {
  0% { opacity: 0.4; }
  100% { opacity: 0.8; }
}

/* ===== 通用动画 ===== */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

/* 730新增：标题若隐若现动态效果 */
@keyframes titlePulse {
  0%, 100% { opacity: 1; filter: drop-shadow(0 0 20px rgba(160,107,255,0.6)); }
  50% { opacity: 0.7; filter: drop-shadow(0 0 40px rgba(255,138,74,0.8)); }
}

/* ===== 按钮交互反馈 ===== */
/* 注：728修改文档要求按钮点击后要有交互反应 */
.btn-press {
  transition: transform 0.1s ease, filter 0.1s ease, box-shadow 0.1s ease;
}
.btn-press:active {
  transform: scale(0.94);
  filter: brightness(1.3);
}

  var LEVEL_CURVES = {
    common: { cap: 10, baseExp: 1e3, growth: 0.15 },
    // 普通：10级上限，基础1000，增长15%
    rare: { cap: 15, baseExp: 1500, growth: 0.18 },
    // 精英：15级上限，基础1500，增长18%
    legendary: { cap: 20, baseExp: 2e3, growth: 0.2 }
    // 传说：20级上限，基础2000，增长20%
  };
  function getLevelCap(rarity) {
    return LEVEL_CURVES[rarity].cap;
  }
  function expNeededForNextLevel(rarity, level) {
    const c = LEVEL_CURVES[rarity];
    return Math.round(c.baseExp * Math.pow(1 + c.growth, Math.max(0, level - 1)));
  }
  function levelHpBonus(level) {
    return Math.max(0, (level - 1) * 5);
  }
  function levelSquadBonus(level) {
    return Math.floor(Math.max(0, level - 1) / 2);
  }
  function levelUpWithExp(level, exp, rarity, amount) {
    let lv = Math.max(1, level || 1);
    let ex = (exp || 0) + amount;
    const cap = getLevelCap(rarity);
    while (lv < cap) {
      const need = expNeededForNextLevel(rarity, lv);
      if (ex < need) break;
      ex -= need;
      lv++;
    }
    return { level: lv, exp: ex };
  }

  function calcEquipStats(equipIds) {
    const stats = {
      totalArmor: 0,
      totalCritResist: 0,
      totalRangedResist: 0,
      totalExplosionResist: 0,
      totalAllResist: 0,
      totalBonusHp: 0,
      totalRangeBonus: 0,
      totalCritRateBonus: 0,
      totalMoveSpeedBonus: 0,
      totalMoveSpeedFlat: 0,
      hasDestiny: false,
      bodyElement: "none"
    };
    for (const slot of ["head", "body", "feet"]) {
      const id = equipIds[slot];
      if (!id || !EQUIPS[id]) continue;
      const e = EQUIPS[id];
      stats.totalArmor += e.armor;
      stats.totalCritResist += e.critResist;
      stats.totalRangedResist += e.rangedResist;
      stats.totalExplosionResist += e.explosionResist;
      stats.totalAllResist += e.allResist || 0;
      stats.totalBonusHp += e.bonusHp;
      stats.totalRangeBonus += e.rangeBonus || 0;
      stats.totalCritRateBonus += e.critRateBonus || 0;
      stats.totalMoveSpeedBonus += e.moveSpeedBonus || 0;
      stats.totalMoveSpeedFlat += e.moveSpeedFlat || 0;
      if (slot === "body") {
        stats.bodyElement = e.element;
        if (e.destiny) stats.hasDestiny = true;
      }
    }
    return stats;
  }

  function damageMultiplier(atk, def) {

    const a = atk;

  function calcEnemyExp(cfg) {
    let dps;
    const w = cfg.weaponId ? WEAPONS[cfg.weaponId] : null;
    if (w) {
      dps = w.damage * w.pellets / w.fireInterval * (cfg.dualWield ? 2 : 1);
    } else {
      dps = cfg.damage * cfg.fireRate;
    }
    const wRange = w ? getWeaponRange(w) + (cfg.rangeBonus || 0) : cfg.range + (cfg.rangeBonus || 0);
    let traitBonus = 0;
    if (cfg.trait === "self_detonate") traitBonus += 40;
    if (cfg.trait === "cunning") traitBonus += 30;
    if (cfg.smartFireControl) traitBonus += 15;
    const v = cfg.maxHp * 0.3 + dps * 1.2 + wRange * 0.1 + (cfg.armor || 0) * 8 + cfg.moveSpeed * 0.15 + traitBonus;
    return Math.max(10, Math.round(v));

  var STAR_THRESHOLDS = [

  var SURVIVAL_MUL_MIN = 0.4;
  var COMMANDER_WEIGHT = 1.5;
  var STAR_BIT_MULTIPLIER = {
    S: 1.5,

    B: 1,
    C: 0.8,
    D: 0.6,

  };
  function calcBattleRating(input) {
    const { victory, gainedExp, totalExp } = input;
    const denom = input.totalCommanders * COMMANDER_WEIGHT + input.totalSoldiers;
    const numer = input.aliveCommanders * COMMANDER_WEIGHT + input.aliveSoldiers;
    const survivalRate = denom > 0 ? Math.min(1, Math.max(0, numer / denom)) : 1;
    const survivalMul = SURVIVAL_MUL_MIN + (1 - SURVIVAL_MUL_MIN) * survivalRate;
    const finalScore = Math.round(gainedExp * survivalMul);
    const ratio = totalExp > 0 ? finalScore / totalExp : 0;
    let star = "F";
    if (victory) {
      for (const t of STAR_THRESHOLDS) {
        if (ratio >= t.minRatio) {
          star = t.star;
          break;
        }
      }
    }
    return {
      victory,
      survivalRate,
      survivalMul,
      finalScore,
      star,
      aliveCommanders: input.aliveCommanders,
      totalCommanders: input.totalCommanders,
      aliveSoldiers: input.aliveSoldiers,
      totalSoldiers: input.totalSoldiers
    };
  }

  // components/game/collision.ts
  function resolveCollisions(entities, iterations = 2) {
    const n = entities.length;
    for (let iter = 0; iter < iterations; iter++) {
      for (let i = 0; i < n; i++) {
        const a = entities[i];
        if (!a.alive || a.collideable === false) continue;
        for (let j = i + 1; j < n; j++) {
          const b = entities[j];
          if (!b.alive || b.collideable === false) continue;
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const distSq = dx * dx + dy * dy;
          const minDist = a.radius + b.radius;
          if (distSq < minDist * minDist && distSq > 1e-4) {
            const dist = Math.sqrt(distSq);
            const overlap = (minDist - dist) * 0.5;
            const nx = dx / dist;
            const ny = dy / dist;
            a.x -= nx * overlap;
            a.y -= ny * overlap;
            b.x += nx * overlap;
            b.y += ny * overlap;
          }
        }
      }
    }
  }
  function clampToWorld(e, worldW, worldH) {
    e.x = Math.max(e.radius, Math.min(worldW - e.radius, e.x));
    e.y = Math.max(e.radius, Math.min(worldH - e.radius, e.y));
  }
