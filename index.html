<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/><title>第十行星 - v0.2测试版</title><style>* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none;
  -webkit-user-select: none;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  color: #e8eef7;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
    "Helvetica Neue", sans-serif;
  overscroll-behavior: none;
  touch-action: none;
}

#root {
  width: 100%;
  height: 100vh;
  height: 100dvh;
}

/* ===== 统一的璀璨银河背景 ===== */
/* 注：728修改文档要求主色调不要纯黑，统一淡色调璀璨银河 */
.galaxy-bg {
  background:
    radial-gradient(ellipse at 20% 30%, rgba(90, 60, 150, 0.25) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(60, 90, 150, 0.2) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(160, 107, 255, 0.08) 0%, transparent 70%),
    linear-gradient(135deg, #1a1f3a 0%, #141833 50%, #1a1530 100%);
  position: relative;
}

/* 星点装饰（伪元素） */
.galaxy-bg::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(1px 1px at 20px 30px, #ffffff, transparent),
    radial-gradient(1px 1px at 60px 70px, #ffffff, transparent),
    radial-gradient(1px 1px at 120px 40px, #a0a8c0, transparent),
    radial-gradient(1px 1px at 200px 90px, #ffffff, transparent),
    radial-gradient(1px 1px at 280px 50px, #a0a8c0, transparent),
    radial-gradient(1px 1px at 350px 120px, #ffffff, transparent),
    radial-gradient(2px 2px at 100px 200px, #ffd86b, transparent),
    radial-gradient(1px 1px at 250px 250px, #ffffff, transparent),
    radial-gradient(1px 1px at 50px 350px, #a0a8c0, transparent),
    radial-gradient(2px 2px at 180px 400px, #a06bff, transparent),
    radial-gradient(1px 1px at 300px 380px, #ffffff, transparent),
    radial-gradient(1px 1px at 80px 500px, #a0a8c0, transparent);
  background-size: 400px 600px;
  background-repeat: repeat;
  opacity: 0.6;
  pointer-events: none;
  animation: starTwinkle 4s ease-in-out infinite alternate;
}

@keyframes starTwinkle {
  0% { opacity: 0.4; }
  100% { opacity: 0.8; }
}

/* ===== 通用动画 ===== */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

/* 730新增：标题若隐若现动态效果 */
@keyframes titlePulse {
  0%, 100% { opacity: 1; filter: drop-shadow(0 0 20px rgba(160,107,255,0.6)); }
  50% { opacity: 0.7; filter: drop-shadow(0 0 40px rgba(255,138,74,0.8)); }
}

/* ===== 按钮交互反馈 ===== */
/* 注：728修改文档要求按钮点击后要有交互反应 */
.btn-press {
  transition: transform 0.1s ease, filter 0.1s ease, box-shadow 0.1s ease;
}
.btn-press:active {
  transform: scale(0.94);
  filter: brightness(1.3);
}

  function calcEquipStats(equipIds) {
    const stats = {
      totalArmor: 0,
      totalCritResist: 0,
      totalRangedResist: 0,
      totalExplosionResist: 0,
      totalBonusHp: 0,
      totalRangeBonus: 0,
      totalCritRateBonus: 0,
      totalMoveSpeedBonus: 0,
      bodyElement: "none"
    };
    for (const slot of ["head", "body", "feet"]) {
      const id = equipIds[slot];
      if (!id || !EQUIPS[id]) continue;
      const e = EQUIPS[id];
      stats.totalArmor += e.armor;
      stats.totalCritResist += e.critResist;
      stats.totalRangedResist += e.rangedResist;
      stats.totalExplosionResist += e.explosionResist;
      stats.totalBonusHp += e.bonusHp;
      stats.totalRangeBonus += e.rangeBonus || 0;
      stats.totalCritRateBonus += e.critRateBonus || 0;
      stats.totalMoveSpeedBonus += e.moveSpeedBonus || 0;
      if (slot === "body") stats.bodyElement = e.element;
    }
    return stats;
  }

  function resolveCollisions(entities, iterations = 2) {
    const n = entities.length;
    for (let iter = 0; iter < iterations; iter++) {
      for (let i = 0; i < n; i++) {
        const a = entities[i];
        if (!a.alive || a.collideable === false) continue;
        for (let j = i + 1; j < n; j++) {
          const b = entities[j];
          if (!b.alive || b.collideable === false) continue;
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const distSq = dx * dx + dy * dy;
          const minDist = a.radius + b.radius;
          if (distSq < minDist * minDist && distSq > 1e-4) {
            const dist = Math.sqrt(distSq);
            const overlap = (minDist - dist) * 0.5;
            const nx = dx / dist;
            const ny = dy / dist;
            a.x -= nx * overlap;
            a.y -= ny * overlap;
            b.x += nx * overlap;
            b.y += ny * overlap;
          }
        }
      }
    }
  }
  function clampToWorld(e, worldW, worldH) {
    e.x = Math.max(e.radius, Math.min(worldW - e.radius, e.x));
    e.y = Math.max(e.radius, Math.min(worldH - e.radius, e.y));
  }

  var ReinforcementSystem = class {
    constructor(ship) {
      this.cooldown = 0;
      // 冷却上限
      // 730修改：后备士兵按种类存储
      this.reserveSoldiers = [];
      this.ship = ship;
      this.cooldownMax = ship.dropCooldown;
      this.cooldown = 0;
    }
    /**
     * 730新增：初始化后备士兵池（按种类）
     * @param reserveSoldiers 后备士兵列表
     */
    initReserveSoldiers(reserveSoldiers) {
      this.reserveSoldiers = reserveSoldiers.map((r) => ({ ...r }));
    }
    /**
     * 获取后备士兵总数
     */
    getReserveCount() {
      return this.reserveSoldiers.reduce((s, r) => s + r.count, 0);
    }
    /**
     * 更新冷却
     */
    update(dt) {
      if (this.cooldown > 0) {
        this.cooldown = Math.max(0, this.cooldown - dt);
      }
    }
    /**
     * 是否就绪（冷却完成 且 后备小兵>0）
     */
    isReady() {
      return this.cooldown <= 0 && this.getReserveCount() > 0;
    }
    /**
     * 冷却进度（0~1，1=就绪）
     */
    getProgress() {
      return 1 - this.cooldown / this.cooldownMax;
    }
    /**
     * 触发增援
     * @param req 增援请求（包含要空投的士兵种类和数量）
     * @returns 实际空投的士兵列表
     */
    trigger(req) {
      if (!this.isReady()) return null;
      let totalReq = 0;
      for (const r of req.soldiers) totalReq += r.count;
      const allowed = Math.min(totalReq, this.ship.dropCapacity, this.getReserveCount());
      if (allowed <= 0) return null;
      const ratio = allowed / totalReq;
      const result = [];
      let remaining = allowed;
      for (let i = 0; i < req.soldiers.length; i++) {
        const r = req.soldiers[i];
        let cnt;
        if (i === req.soldiers.length - 1) {
          cnt = remaining;
        } else {
          cnt = Math.floor(r.count * ratio);
          remaining -= cnt;
        }
        if (cnt > 0) result.push({ soldierId: r.soldierId, count: cnt });
      }
      for (const r of result) {
        const reserve = this.reserveSoldiers.find((rs) => rs.soldierId === r.soldierId);
        if (reserve) {
          reserve.count = Math.max(0, reserve.count - r.count);
        }
      }
      this.reserveSoldiers = this.reserveSoldiers.filter((rs) => rs.count > 0);
      this.cooldown = this.cooldownMax;
      return result;
    }
    // 兼容旧代码：reserveCount 属性
    get reserveCount() {
      return this.getReserveCount();
    }
  };
  function calcDropPositions(centerX, centerY, count, radius = 40) {
    const positions = [];
    for (let i = 0; i < count; i++) {
      const angle = i / count * Math.PI * 2 + Math.random() * 0.3;
      const r = radius + Math.random() * 20;
      positions.push({
        x: centerX + Math.cos(angle) * r,
        y: centerY + Math.sin(angle) * r
      });
    }
    return positions;
  }

      const dx = p.x - target.x;
